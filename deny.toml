# https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Permissive data licence of the Mozilla root certificates (webpki-root-certs, for HTTPS to Resend).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crate is not published, so it doesn't need a license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
