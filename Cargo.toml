[package]
name = "api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
csv = "1.4.0"
mime_guess = "2.0.5"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2.2", features = ["uuid1", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
